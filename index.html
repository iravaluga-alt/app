<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Записи</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header__panel">
    <!-- Ліва інтерактивна кнопка -->
            <button class="header__btn" aria-label="Календар">
                <span class="header__icon icon-calendar"></span> 
            </button>

    <!-- Центральна статична частина -->
            <div class="header__title-wrapper">
                <span class="header__title">Записи</span>
            </div>

    <!-- Права інтерактивна кнопка -->
            <button class="header__btn" aria-label="Пошук">
                <span class="header__icon icon-search"></span>
            </button>
        </div>
    </header>
    <section class="summary">
  <!-- Ліва частина: Рік та Місяць -->
        <div class="summary__date">
            <span class="summary__year">2026</span>
                <h2 class="summary__month">Квітень</h2>
                    <span class="summary__day">02.04.26</span>
        </div>

  <!-- Права частина: Фінансова статистика -->
        <div class="summary__stats">
            <div class="summary__item">
                <span class="summary__label">Витрати</span>
                <span class="summary__value">1100</span>
            </div>
            <div class="summary__item">
                <span class="summary__label">Дохід</span>
                <span class="summary__value">20000</span>
            </div>
    <!-- Інтерактивна кнопка "Доступно" -->
            <button class="summary__btn-available">
                <span class="summary__label-small">Доступно</span>
                <span class="summary__value-large">5500</span>
            </button>
        </div>
    <main class="feed">
    <!-- Група за 02.04.26 -->
    <div class="feed__group">
        <p class="feed__date">02.04.26</p>
        
        <div class="feed__item">
            <div class="feed__left">
                <div class="feed__icon-bg icon-bg--health">
                    <span class="header__icon icon-health"></span>
                </div>
                <span class="feed__name">здоров'я</span>
            </div>
            <span class="feed__amount expense">100</span>
        </div>

        <div class="feed__item">
            <div class="feed__left">
                <div class="feed__icon-bg icon-bg--fun">
                    <span class="header__icon icon-fun"></span>
                </div>
                <span class="feed__name">розваги</span>
            </div>
            <span class="feed__amount expense">550</span>
        </div>
    </div>

    <!-- Група за 01.04.26 -->
    <div class="feed__group">
        <p class="feed__date">01.04.26</p>
        
        <div class="feed__item">
            <div class="feed__left">
                <div class="feed__icon-bg icon-bg--health">
                    <span class="header__icon icon-health"></span>
                </div>
                <span class="feed__name">здоров'я</span>
            </div>
            <span class="feed__amount expense">450</span>
        </div>

        <div class="feed__item">
            <div class="feed__left">
                <div class="feed__icon-bg icon-bg--income">
                    <span class="header__icon icon-income"></span>
                </div>
                <span class="feed__name">основний дохід</span>
            </div>
            <span class="feed__amount income">20000</span>
        </div>
    </div>
</main>    
</section>
    <nav class="nav">
    <div class="nav__panel">
        <!-- 1. Записи (темна кнопка) -->
        <button class="nav__btn nav__btn--active" aria-label="Записи">
            <span class="header__icon icon-notes"></span>
        </button>

        <!-- 2. Додати (плюс) -->
        <button class="nav__btn" aria-label="Додати">
            <span class="header__icon icon-plus"></span>
        </button>

        <!-- 3. Аналітика (графік) -->
        <button class="nav__btn" aria-label="Аналітика">
            <span class="header__icon icon-analytics"></span>
        </button>

        <!-- 4. Акаунт (профіль) -->
        <button class="nav__btn" aria-label="Профіль">
            <span class="header__icon icon-account"></span>
        </button>
        </div>
    </nav>
</body>
</html>
